[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdlm"
version = "0.2.0"
description = "Joint protein-DNA masked language modeling"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23,<2",
  "PyYAML>=6,<7",
  "safetensors>=0.4,<1",
  "torch>=2.0,<3",
  "tqdm>=4.65",
  "transformers==4.44.2",
]

[project.scripts]
pdlm-train = "pdlm.train:main"
pdlm-score = "pdlm.scoring:main"
pdlm-embed = "pdlm.embeddings:main"

[tool.setuptools.packages.find]
where = ["src"]
